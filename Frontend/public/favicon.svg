<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="coabShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Black Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" filter="url(#coabShadow)" stroke="#27272a" stroke-width="1.5" />

  <!-- Coin circle & currency/growth symbol -->
  <g fill="none" stroke="url(#emeraldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="17.5" stroke="#34d399" stroke-width="2.6" opacity="0.4" />
    <path d="M32 20v24" stroke-width="3" />
    <path d="M37 25c-1-1.3-2.6-2-4.8-2-2.8 0-4.6 1.4-4.6 3.2 0 2 1.8 2.8 4.6 3.3 3.2.6 5.2 1.5 5.2 3.7 0 2.2-2.2 3.8-5.4 3.8-2.6 0-4.5-.9-5.4-2.4" stroke-width="3" />
  </g>
</svg>
